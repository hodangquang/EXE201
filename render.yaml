services:
  - type: web
    name: rewear-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://rewear-wyb0.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
